services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: anomaly_intelligence
      POSTGRES_USER: anomaly
      POSTGRES_PASSWORD: anomaly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://anomaly:anomaly@postgres:5432/anomaly_intelligence
      FRONTEND_ORIGIN: http://localhost:5173

      GENAI_ENABLED: ${GENAI_ENABLED:-false}
      GENAI_PROVIDER: ${GENAI_PROVIDER:-groq}
      GENAI_MODEL: ${GENAI_MODEL:-openai/gpt-oss-20b}
      GENAI_BASE_URL: ${GENAI_BASE_URL:-https://api.groq.com/openai/v1}
      GENAI_API_KEY: ${GENAI_API_KEY:-}

    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: